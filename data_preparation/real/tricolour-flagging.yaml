# time_extend/freq_extend: 0 — pixel-specific flags, no dilation.
# flag_all_time_frac/flag_all_freq_frac: 1.0 — no blanket row/column flagging.
# Persistent L-band emitters from oxkat/MeerKAT Cookbook are applied statically
# in extract_ms.py — tricolour absorbs them into its background estimate.
strategies:
    -
        name: flag_nans_zeros
        task: flag_nans_zeros
    -
        name: background_static_mask
        task: apply_static_mask
        kwargs:
            accumulation_mode: "or"
            uvrange: ""
    -
        name: background_flags
        task: sum_threshold
        kwargs:
            outlier_nsigma: 8
            windows_time: [1, 2, 4, 8]
            windows_freq: [1, 2, 4, 8]
            background_reject: 2.0
            background_iterations: 5
            spike_width_time: 12.5
            spike_width_freq: 10.0
            time_extend: 0
            freq_extend: 0
            freq_chunks: 10
            average_freq: 1
            flag_all_time_frac: 1.0
            flag_all_freq_frac: 1.0
            rho: 1.3
            num_major_iterations: 5
    -
        name: residual_flag
        task: uvcontsub_flagger
        kwargs:
            major_cycles: 7
            or_original_from_cycle: 0
            taylor_degrees: 10
            sigma: 7.5
    -
        name: flag_autos
        task: flag_autos
    -
        name: combine_with_input_flags
        task: combine_with_input_flags
