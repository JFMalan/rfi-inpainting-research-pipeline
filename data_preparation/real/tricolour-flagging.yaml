# uvcontsub_flagger removed — causes blanket over-flagging on uncalibrated data
# apply_static_mask added explicitly to use MeerKAT L-band built-in persistent RFI mask
# outlier_nsigma lowered to 6 for better sensitivity to moderate-strength RFI
# flag_all_time_frac/flag_all_freq_frac kept at defaults (0.6/0.8) — intentional blanket
# flagging of persistent bands is correct and expected behaviour
strategies:
    # only enable me if you really want to start from scratch
    # -
    #   name: reset_flags
    #   task: unflag
    -
        name: flag_nans_zeros
        task: flag_nans_zeros
    -
        name: background_static_mask
        task: apply_static_mask
        kwargs:
            accumulation_mode: "or"
            uvrange: ""
    -
        name: background_flags
        task: sum_threshold
        kwargs:
            outlier_nsigma: 6
            windows_time: [1, 2, 4, 8]
            windows_freq: [1, 2, 4, 8]
            background_reject: 2.0
            background_iterations: 5
            spike_width_time: 12.5
            spike_width_freq: 10.0
            time_extend: 0
            freq_extend: 0
            freq_chunks: 10
            average_freq: 1
            flag_all_time_frac: 1.0
            flag_all_freq_frac: 1.0
            rho: 1.3
            num_major_iterations: 5
    -
        name: final_st_very_broad
        task: sum_threshold
        kwargs:
            outlier_nsigma: 6
            windows_time: [1, 2, 4, 8]
            windows_freq: [32, 48, 64, 128]
            background_reject: 2.0
            background_iterations: 5
            spike_width_time: 6.5
            spike_width_freq: 64.0
            time_extend: 0
            freq_extend: 0
            freq_chunks: 10
            average_freq: 1
            flag_all_time_frac: 1.0
            flag_all_freq_frac: 1.0
            rho: 1.3
            num_major_iterations: 1
    -
        name: final_st_broad
        task: sum_threshold
        kwargs:
            outlier_nsigma: 6
            windows_time: [1, 2, 4, 8]
            windows_freq: [1, 2, 4, 8]
            background_reject: 2.0
            background_iterations: 5
            spike_width_time: 6.5
            spike_width_freq: 10.0
            time_extend: 0
            freq_extend: 0
            freq_chunks: 10
            average_freq: 1
            flag_all_time_frac: 1.0
            flag_all_freq_frac: 1.0
            rho: 1.3
            num_major_iterations: 1
    -
        name: final_st_narrow
        task: sum_threshold
        kwargs:
            outlier_nsigma: 6
            windows_time: [1, 2, 4, 8]
            windows_freq: [1, 2, 4, 8]
            background_reject: 2.0
            background_iterations: 5
            spike_width_time: 2
            spike_width_freq: 10.0
            time_extend: 0
            freq_extend: 0
            freq_chunks: 10
            average_freq: 1
            flag_all_time_frac: 1.0
            flag_all_freq_frac: 1.0
            rho: 1.3
            num_major_iterations: 1
    -
        name: flag_autos
        task: flag_autos
    -
        name: combine_with_input_flags
        task: combine_with_input_flags
